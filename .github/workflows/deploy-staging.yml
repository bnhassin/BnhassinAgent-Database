name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deployment
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_REGION: ${{ vars.GCP_REGION }}

jobs:
  deploy-staging:
    name: Deploy BnhassinAgent to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate GCP configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_CLOUD_PROJECT:?Set staging variable GCP_PROJECT_ID}"
          : "${GOOGLE_CLOUD_REGION:?Set staging variable GCP_REGION}"
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud services enable aiplatform.googleapis.com --project="$GOOGLE_CLOUD_PROJECT"
          gcloud auth list
          gcloud config get-value project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install agent dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f requirements.txt ]]; then
            echo "No requirements.txt found. The repository is not yet deployable as a Python agent."
            echo "Create requirements.txt and the agent source before enabling the deployment step."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate agent source
        shell: bash
        run: |
          set -euo pipefail
          if ! find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "No Python agent source found. Expected the BnhassinAgent implementation before deployment."
            exit 1
          fi
          python -m compileall -q .

      - name: Staging smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          if [[ -f tests/test_smoke.py ]]; then
            python -m pytest -q tests/test_smoke.py
          elif [[ -d tests ]]; then
            python -m pytest -q tests
          else
            echo "No tests directory yet; deployment is blocked until staging tests exist."
            exit 1
          fi

      - name: Deployment handoff
        shell: bash
        run: |
          echo "GCP authentication and staging validation succeeded."
          echo "Final Agent Runtime deployment is intentionally gated until a concrete BnhassinAgent entry point is committed."
          echo "Target: Vertex AI / Gemini Enterprise Agent Platform Agent Runtime."
