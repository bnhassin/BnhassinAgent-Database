name: CoinMarketCap MCP Preview checks

on:
  pull_request:
    branches: [main]
    paths:
      - "api/cmc/**"
      - "lib/coinmarketcap/**"
      - "test/coinmarketcap-mcp.test.js"
      - "docs/integrations/coinmarketcap.md"
      - "package.json"
      - ".github/workflows/cmc-preview.yml"
  push:
    branches: ["feature/cmc-mcp-preview"]
    paths:
      - "api/cmc/**"
      - "lib/coinmarketcap/**"
      - "test/coinmarketcap-mcp.test.js"
      - "package.json"
      - ".github/workflows/cmc-preview.yml"

permissions:
  contents: read

jobs:
  test-cmc-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run CMC MCP unit tests
        run: npm test
