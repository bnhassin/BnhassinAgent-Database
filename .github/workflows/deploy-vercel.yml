name: Vercel Preview validation

# Vercel Git integration creates Preview deployments for pull requests.
# This workflow validates the branch; it never deploys or promotes Production.

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/cmc-mcp-preview"]

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CMC MCP unit tests
        run: npm test
