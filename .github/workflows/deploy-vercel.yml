name: Vercel Preview Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "webhook-service/**"
      - ".github/workflows/deploy-vercel.yml"
  push:
    branches:
      - feat/paypal-sandbox-webhook-preview

permissions:
  contents: read

concurrency:
  group: vercel-preview-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-readiness:
    name: Verify Vercel Preview application root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate dedicated application root
        shell: bash
        run: |
          set -euo pipefail
          test -f webhook-service/package.json
          test -f webhook-service/api/health.js
          test -f webhook-service/api/webhooks/paypal.js
          node -e "JSON.parse(require('node:fs').readFileSync('webhook-service/package.json','utf8'))"
          echo "Vercel Root Directory webhook-service is present."
          echo "Vercel Git integration owns Preview deployment creation."
          echo "This workflow does not deploy or promote Production."
