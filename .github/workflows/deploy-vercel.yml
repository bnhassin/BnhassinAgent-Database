name: Vercel Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy Vercel Preview
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Vercel credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Add VERCEL_TOKEN as a GitHub Actions secret}"
          : "${VERCEL_ORG_ID:?Add VERCEL_ORG_ID as a repository variable}"
          : "${VERCEL_PROJECT_ID:?Add VERCEL_PROJECT_ID as a repository variable}"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview artifacts
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Preview only
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
