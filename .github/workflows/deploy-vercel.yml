name: Vercel Preview Verification

# Vercel's Git integration owns Preview deployments. This workflow verifies
# its commit status and deliberately does not run "vercel deploy", avoiding
# duplicate deployments.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: vercel-preview-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-preview:
    name: Verify Vercel Preview status
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel Preview status
        uses: actions/github-script@v7
        env:
          EXPECTED_CONTEXT: "Vercel – bnhassin-agent-database"
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const expected = process.env.EXPECTED_CONTEXT;
            const attempts = 20;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const response = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const status = response.data.find(item => item.context === expected);
              core.info(`Attempt ${attempt}/${attempts}: ${status?.state || "status not reported"}`);
              if (status?.state === "success") {
                core.notice(`Vercel Preview succeeded: ${status.target_url || "status available"}`);
                return;
              }
              if (status && ["failure", "error"].includes(status.state)) {
                core.setFailed(`Vercel Preview reported ${status.state}: ${status.target_url || "no target URL"}`);
                return;
              }
              if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed(`Timed out waiting for Vercel status context: ${expected}`);
