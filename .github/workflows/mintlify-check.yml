name: Mintlify documentation checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs.json'
      - '**/*.mdx'
      - '**/*.md'
      - '.github/workflows/mintlify-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m json.tool docs.json >/dev/null
      - run: git diff --check
      - run: npm install --global mint
      - run: mint validate
      - run: mint broken-links
      - run: mint a11y
