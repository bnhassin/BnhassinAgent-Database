name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Git diff
        run: git diff --check

      - name: Validate JSON documentation config when present
        shell: bash
        run: |
          if [[ -f docs.json ]]; then
            python -m json.tool docs.json >/dev/null
          else
            echo "docs.json not present; skipping JSON validation."
          fi

      - name: Detect accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,})' .; then
            echo "Potential API credential found in tracked source. Use GitHub Secrets instead."
            exit 1
          fi

      - name: Python syntax check when Python sources are present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.py' -not -path './.git/*')
          if (( ${#files[@]} == 0 )); then
            echo "No Python source files yet; syntax check skipped."
            exit 0
          fi
          python -m compileall -q "${files[@]}"

      - name: Python dependency smoke check when requirements exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f requirements.txt ]]; then
            echo "requirements.txt not present; dependency installation skipped."
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Summary
        run: |
          echo "BnhassinAgent-Database CI passed."
          echo "Default branch: main"
          echo "Deployment is handled by staging and production workflows."
