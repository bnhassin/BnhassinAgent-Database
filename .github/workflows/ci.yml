name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Git diff
        run: git diff --check

      - name: Validate JSON documentation config when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs.json ]]; then
            python -m json.tool docs.json >/dev/null
          else
            echo "docs.json not present; skipping JSON validation."
          fi

      - name: Detect accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md' \
            '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,})' .; then
            echo "Potential API credential found in tracked source. Use GitHub Secrets instead."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax check
        shell: bash
        run: python -m compileall -q agent api tests

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Summary
        run: |
          echo "BnhassinAgent-Database CI passed."
          echo "Vercel Preview deployment is handled by deploy-vercel.yml."
          echo "Production deployment is not performed by this workflow."
