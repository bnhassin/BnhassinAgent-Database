name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Validate Git diff
        run: git diff --check

      - name: Validate JSON documentation config when present
        shell: bash
        run: |
          if [[ -f docs.json ]]; then
            python -m json.tool docs.json >/dev/null
          else
            echo "docs.json not present; skipping JSON validation."
          fi

      - name: Detect accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md' \
            '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,})' .; then
            echo "Potential API credential found in tracked source. Use GitHub Secrets instead."
            exit 1
          fi

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-cov

      - name: Python syntax check
        run: python -m compileall -q bnhassinagent tests

      - name: Run tests with coverage
        run: python -m pytest -q --cov=bnhassinagent --cov-report=term-missing

      - name: Summary
        if: always()
        run: |
          echo "CI validates Python syntax and the automated test suite."
          echo "Vercel deployment is managed by the connected Vercel Git integration."
          echo "No Production deployment is initiated by this workflow."
