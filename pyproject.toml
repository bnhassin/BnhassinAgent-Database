[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bnhassinagent-database"
version = "0.1.0"
description = "Event and metrics foundations for BnhassinAgent"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["bnhassinagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
